name: rcpms-jax
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip

  # Core scientific
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-learn

  # Notebooks
  - jupyterlab
  - ipykernel

  # Cartopy for map projections (easier via conda)
  - cartopy

  # Utilities
  - tqdm
  - pyyaml

  - pip:
      # JAX stack (CPU - for GPU, install jax[cuda] separately)
      - jax==0.4.28
      - jaxlib==0.4.28

      # Deep learning
      - flax==0.8.4
      - optax==0.2.3
      - chex

      # Config management (for rcpm)
      - hydra-core>=1.3.0
      - omegaconf>=2.3.0

      # Utilities
      - einops
      - dm-tree
      - setproctitle
      - spherical-kde

      # Experiment tracking
      - wandb
